version: 2.1

executors:
  # No database, no browser: the two scanners and RuboCop.
  ruby:
    docker:
      - image: cimg/ruby:4.0.6
    working_directory: ~/agentilda

commands:
  install_packages:
    description: >-
      The apt packages the runner image does not carry. Note the absence of
      google-chrome-stable, which the GitHub `test` job installed: the
      `-browsers` image variant already ships it, and layering a second Chrome
      over the top is how a browser and a driver stop agreeing.

      clang and libclang-dev are for ratatui_ruby: rb-sys generates its Ruby
      bindings with bindgen, which dlopens libclang at build time and panics
      with "Unable to find libclang" without it. gcc is not a substitute.
    steps:
      - run:
          name: Install packages
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips \
              clang libclang-dev

  install_rust:
    description: >-
      ratatui_ruby is a Rust extension and cimg/ruby carries no toolchain, so
      `bundle install` stops at `checking for cargo... no` and the gem fails to
      build. rustup's own installer is the documented route and pins nothing
      the image would argue with. Cached because compiling the extension from
      scratch costs more than every other gem in the bundle put together.
    steps:
      - restore_cache:
          keys:
            - v1-cargo-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - v1-cargo-{{ arch }}-
      - run:
          name: Install Rust toolchain
          command: |
            if ! command -v cargo > /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
      - save_cache:
          key: v1-cargo-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/.cargo
            - ~/.rustup

  bundle_deps:
    description: >-
      Replaces `bundler-cache: true`. Same idea, spelled out: restore, install,
      save, keyed on Gemfile.lock — the gem's bundle is the only one
      this repo has, and it does not sit at the root.
    steps:
      - restore_cache:
          keys:
            - v2-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
            - v2-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-
      - run:
          name: Install Ruby dependencies
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs=4 --retry=3
            bundle clean --force
      - save_cache:
          key: v2-bundle-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

jobs:
  linter:
    executor: ruby
    steps:
      - checkout
      - install_packages
      - install_rust
      - bundle_deps
      # `-f github` emitted GitHub's command annotations, which mean
      # nothing to CircleCI's log renderer. Plain output; the offences are
      # identical.
      - run:
          command: BUNDLE_GEMFILE=Gemfile bundle exec rubocop
          name: Lint with Rubocop

  test:
    # ubuntu-latest is 4 vCPU / 16 GB; CircleCI's `medium` is 2 vCPU. `large`
    # is the closest match. Drop to `medium` if the credit burn matters more
    # than the wall clock — nothing here needs the extra cores to be correct.
    resource_class: medium
    docker:
      - image: cimg/ruby:4.0.6
    working_directory: ~/agentilda
    steps:
      - checkout
      - install_packages
      - install_rust
      - bundle_deps
      - run:
          name: Run tests
          command: bundle exec rspec

workflows:
  # .github/workflows/ci.yml + lint.yml + biome.yml. They are separate files on
  # GitHub only because that is the unit GitHub schedules; nothing depended on
  # them being independent, and one workflow gives one status to read.
  ci:
    jobs:
      - test
      - linter
